# VORAEL — nginx del contenedor web (docker-compose).
#
# Equivalente de deploy/nginx-vorael.conf adaptado a standalone:
#   - escucha en 5173 (el contenedor usa network_mode: host, así que el
#     puerto es directo del host, sin mapeo);
#   - root en vez de alias: los archivos viven en
#     /usr/share/nginx/html/vorael/ y las URIs ya arrancan en /vorael/;
#   - proxea a 127.0.0.1:3001 (el API también está en host network).
server {
    listen       5173;
    server_name  _;
    root         /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /vorael sin barra final -> redirigir (si no, el SPA no matchea).
    location = /vorael {
        return 301 /vorael/;
    }

    # Raíz -> SPA.
    location = / {
        return 301 /vorael/;
    }

    # API. Debe ir aquí: sin este bloque, `^~ /vorael/` se traga /vorael/api/*
    # y devuelve index.html (HTML) donde el front espera JSON.
    # La barra final en proxy_pass reemplaza el prefijo:
    #   /vorael/api/images  ->  http://127.0.0.1:3001/api/images
    location ^~ /vorael/api/ {
        proxy_pass http://127.0.0.1:3001/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # /api/images/:id/download descarga desde S3 y reconvierte con sharp:
        # puede tardar en imágenes grandes.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Descargas: entregar tal cual, sin bufferizar el archivo completo.
        proxy_buffering off;
    }

    # Assets con hash en el nombre -> inmutables, cache larga.
    location ^~ /vorael/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html nunca en cache: si el navegador lo cachea, tras un redeploy
    # sigue pidiendo los assets viejos -> pantalla en blanco.
    location = /vorael/index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA: estáticos + fallback a index.html para las rutas de React Router
    # (/vorael/search, /vorael/image/:id, /vorael/tag/:tag, ...).
    location ^~ /vorael/ {
        index index.html;
        error_page 404 = /vorael/index.html;
    }
}
