# VORAEL — servido bajo https://n8n.americana.edu.co/vorael/
#
# Pegar estos bloques DENTRO del `server { ... }` de n8n.americana.edu.co.
# El orden en el archivo no importa: Nginx elige por especificidad
# (`= exacto` > `^~ prefijo más largo`), así que /vorael/api/ gana sobre /vorael/.
#
# Layout esperado en el servidor:
#   /var/www/html/vorael/dist/          <- contenido de apps/web/dist
#   API Express escuchando en 127.0.0.1:3001

# 1) /vorael sin barra final -> redirigir. `location ^~ /vorael/` NO matchea
#    "/vorael" a secas, y sin esto ese enlace devuelve 404.
location = /vorael {
    return 301 /vorael/;
}

# 2) API. Debe ir aquí: sin este bloque, `^~ /vorael/` se traga /vorael/api/*
#    y devuelve index.html (HTML) donde el front espera JSON.
#    La barra final en proxy_pass reemplaza el prefijo:
#      /vorael/api/images  ->  http://127.0.0.1:3001/api/images
location ^~ /vorael/api/ {
    proxy_pass http://127.0.0.1:3001/api/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # /api/images/:id/download descarga desde S3 y reconvierte con sharp:
    # puede tardar en imágenes grandes.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Descargas: entregar tal cual, sin bufferizar el archivo completo.
    proxy_buffering off;
}

# 3) Assets con hash en el nombre -> inmutables, cache larga.
location ^~ /vorael/assets/ {
    alias /var/www/html/vorael/dist/assets/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# 4) index.html nunca en cache: si el navegador lo cachea, tras un redeploy
#    seguirá pidiendo los assets viejos (que ya no existen) -> pantalla en blanco.
location = /vorael/index.html {
    alias /var/www/html/vorael/dist/index.html;
    add_header Cache-Control "no-store, must-revalidate";
}

# 5) SPA: estáticos + fallback a index.html para las rutas de React Router
#    (/vorael/search, /vorael/image/:id, /vorael/tag/:tag, ...).
location ^~ /vorael/ {
    alias /var/www/html/vorael/dist/;
    index index.html;
    error_page 404 = /vorael/index.html;
}
